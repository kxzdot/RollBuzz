name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка Capacitor
        run: npm install --no-audit --no-fund

      - name: Создание Android-проекта
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Доступ к камере (сканер штрихкодов)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          grep -n "CAMERA\|VIBRATE\|hardware.camera" $M

      - name: Иконка приложения
        run: |
          test -d android-res
          cp -r android-res/. android/app/src/main/res/

      - name: Постоянная подпись и номер версии
        run: |
          # Одна и та же подпись в каждой сборке: новую версию можно ставить поверх старой
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle || true
          grep -n "versionCode" android/app/build.gradle || true

      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Сохранение APK
        uses: actions/upload-artifact@v4
        with:
          name: sklad-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
