name: Сборка APK и программы для Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка Capacitor
        run: npm install --no-audit --no-fund

      - name: Голосовой ввод (необязательно)
        # если модуль распознавания речи не установится, приложение соберётся без голосового ввода
        continue-on-error: true
        run: npm install @capacitor-community/speech-recognition@^7.0.0 --no-audit --no-fund

      - name: Автообновление (необязательно)
        # модуль, который ставит новую версию экрана приложения без переустановки APK
        continue-on-error: true
        run: npm install @capgo/capacitor-updater@^7 --no-audit --no-fund

      - name: Создание Android-проекта
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Доступ к камере (сканер штрихкодов)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          grep -n "CAMERA\|VIBRATE\|hardware.camera" $M

      - name: Иконка приложения
        run: |
          test -d android-res
          cp -r android-res/. android/app/src/main/res/

      - name: Постоянная подпись и номер версии
        run: |
          # Одна и та же подпись в каждой сборке: новую версию можно ставить поверх старой.
          # Ключ из репозитория прописывается в сборку явно (раньше Gradle мог взять случайный ключ из другой папки).
          test -f debug.keystore
          G=android/app/build.gradle
          grep -q "sklad-keystore" $G || cat >> $G <<'GRADLE'

          // sklad-keystore: постоянный ключ подписи из репозитория
          android {
              signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.debug } }
          }
          GRADLE
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" $G || true
          grep -n "versionCode\|sklad-keystore" $G || true

      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Проверка подписи
        # отпечаток должен быть одинаковым у всех сборок: 56:1B:18:B0:...:AB:22
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA256"

      - name: Сохранение APK
        uses: actions/upload-artifact@v4
        with:
          name: sklad-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Публикация обновления для телефонов
        # нужны секреты репозитория SUPABASE_URL и SUPABASE_SECRET_KEY (см. ОБНОВЛЕНИЯ.md); без них шаг пропускается
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then echo "Секреты не заданы: автообновление не публикуется"; exit 0; fi
          SB_URL="${SB_URL%/}"
          VER=$(grep -o 'APP_VERSION = "[^"]*"' www/index.html | head -1 | cut -d'"' -f2)
          N=${{ github.run_number }}
          (cd www && zip -qr ../web.zip .)
          cp android/app/build/outputs/apk/debug/app-debug.apk sklad.apk
          if [[ "$SB_KEY" == sb_* ]]; then AUTH=(-H "apikey: $SB_KEY"); else AUTH=(-H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY"); fi
          up() { curl -sS --fail-with-body -X POST "$SB_URL/storage/v1/object/app/$2" "${AUTH[@]}" -H "x-upsert: true" -H "cache-control: $4" -H "Content-Type: $3" --data-binary "@$1"; echo; }
          up sklad.apk "sklad-$N.apk" application/vnd.android.package-archive 31536000
          up web.zip "web-$N.zip" application/zip 31536000
          up sklad.apk "sklad-latest.apk" application/vnd.android.package-archive 60
          up www/index.html "index-latest.html" "text/plain; charset=utf-8" 30
          PUB="$SB_URL/storage/v1/object/public/app"
          printf '{"version":"%s","code":%s,"apk":"%s/sklad-%s.apk","web":"%s/web-%s.zip","at":"%s"}' "$VER" "$N" "$PUB" "$N" "$PUB" "$N" "$(date -u +%FT%TZ)" > version.json
          cat version.json
          up version.json version.json application/json 30

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Настройки подключения
        shell: bash
        run: |
          test -f desktop/app/launcher.html
          cp www/config.js desktop/app/config.js

      - name: Установка Electron
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Сборка установщика
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - name: Сохранение установщика
        uses: actions/upload-artifact@v4
        with:
          name: sklad-setup
          path: desktop/dist/sklad-setup.exe

      - name: Публикация в «Releases»
        # установщик всегда лежит по одной ссылке: Releases → «Склад тканей для Windows» → sklad-setup.exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop >/dev/null 2>&1 || gh release create desktop --title "Склад тканей для Windows" --notes "Установщик программы для компьютера. Скачайте sklad-setup.exe и запустите."
          gh release upload desktop desktop/dist/sklad-setup.exe --clobber
          echo "Ссылка: https://github.com/${{ github.repository }}/releases/download/desktop/sklad-setup.exe"
