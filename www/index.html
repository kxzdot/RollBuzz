<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Склад тканей</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #e8eae4;
  --surface: #fafaf7;
  --surface-2: #eff0eb;
  --fg: #1b2130;
  --muted: #626a77;
  --line: #d3d6cd;
  --accent: #2f3fb5;
  --accent-fg: #ffffff;
  --accent-soft: #e2e5f8;
  --tag: #f2c230;
  --tag-fg: #211c08;
  --danger: #b3322a;
  --ok: #2a7d50;
  --shadow: 0 18px 40px -12px rgba(27, 33, 48, 0.35);
  --lift: 0 1px 0 rgba(27, 33, 48, 0.04), 0 2px 6px -2px rgba(27, 33, 48, 0.10);
  --weave-a: rgba(255, 255, 255, 0.16);
  --weave-b: rgba(0, 0, 0, 0.12);
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --spring: cubic-bezier(0.22, 1.25, 0.36, 1);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111419; --surface: #1a1e25; --surface-2: #232831; --fg: #eceef2; --muted: #99a0ac; --line: #2e343f;
    --accent: #8f9bff; --accent-fg: #10131a; --accent-soft: #252b4a; --tag: #f2c230; --tag-fg: #211c08;
    --danger: #ff8a7a; --ok: #6fd3a0; --shadow: 0 18px 44px -10px rgba(0, 0, 0, 0.7); --lift: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111419; --surface: #1a1e25; --surface-2: #232831; --fg: #eceef2; --muted: #99a0ac; --line: #2e343f;
  --accent: #8f9bff; --accent-fg: #10131a; --accent-soft: #252b4a; --tag: #f2c230; --tag-fg: #211c08;
  --danger: #ff8a7a; --ok: #6fd3a0; --shadow: 0 18px 44px -10px rgba(0, 0, 0, 0.7); --lift: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent; font-feature-settings: "tnum" 0;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { max-width: 560px; margin-inline: auto; padding-inline: 16px; padding-block: 0 128px; }

/* ткань: переплетение нитей поверх цвета */
.weave {
  background-color: var(--c, var(--surface-2));
  background-image:
    repeating-linear-gradient(0deg, var(--weave-a) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, var(--weave-b) 0 1px, transparent 1px 4px);
}
.weave.blank { --c: var(--surface-2); background-image: repeating-linear-gradient(135deg, var(--line) 0 1px, transparent 1px 7px); }

/* ---------- шапка ---------- */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 12px; }
.top::after { content: ""; position: absolute; left: -16px; right: -16px; bottom: -14px; height: 14px; background: linear-gradient(var(--bg), transparent); pointer-events: none; }
.brand, .selbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.brand .title { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; }
.brand h1 { margin: 0; font-size: 1.3125rem; font-weight: 700; letter-spacing: -0.02em; min-width: 0; }
.logo { width: 40px; height: 40px; border-radius: 11px; flex: none; display: block; }
.net { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8125rem; color: var(--muted); white-space: nowrap; }
.net i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.net.off { color: var(--danger); font-weight: 600; }
.net.off i { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 22%, transparent); }
.avatar { width: 44px; height: 44px; border-radius: 50%; border: 0; flex: none; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 1.0625rem; }
.selbar { justify-content: space-between; }
.selbar .count-sel { font-weight: 700; font-size: 1.1875rem; flex: 1; letter-spacing: -0.01em; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface-2); color: var(--fg); font-size: 1.25rem; flex: none; }
.text-btn { height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; flex: none; }

.search { position: relative; }
.search input {
  width: 100%; height: 58px; padding: 0 54px 0 50px; border-radius: 18px; border: 2px solid transparent;
  background: var(--surface); box-shadow: var(--lift); font-family: var(--f-mono); font-size: 1.25rem; font-weight: 500; letter-spacing: 0.02em;
}
.search input::placeholder { font-family: var(--f-body); font-size: 1.0625rem; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.search input:focus { border-color: var(--accent); outline: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search .mag { position: absolute; left: 17px; top: 50%; width: 22px; height: 22px; margin-top: -11px; color: var(--muted); pointer-events: none; }
.search button { position: absolute; right: 8px; top: 8px; height: 42px; width: 42px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-size: 1.0625rem; }

/* сегменты с бегунком */
.tabs { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--surface-2); padding: 4px; border-radius: 14px; }
.top .tabs { background: color-mix(in srgb, var(--fg) 7%, transparent); }
.tabs .ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--n, 3)); transform: translateX(calc(var(--ti, 0) * 100%)); border-radius: 10px; background: var(--surface); box-shadow: var(--lift), 0 0 0 1px var(--line); }
.tab { position: relative; z-index: 1; min-height: 48px; padding: 4px 4px; display: grid; align-content: center; justify-items: center; line-height: 1.15; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 0.9375rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab[aria-selected="true"] { color: var(--fg); font-weight: 650; }
.tab .n { display: block; font-family: var(--f-mono); font-size: 0.75rem; font-weight: 500; opacity: 0.75; }

.banner { margin-block: 4px 0; padding: 12px 14px; border-radius: 14px; font-size: 0.875rem; background: var(--surface); color: var(--muted); border: 1px dashed var(--line); }
.banner.err { color: var(--danger); border-color: var(--danger); background: transparent; font-weight: 600; }

.count-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; margin: 6px 0 6px; }
.count { font-size: 0.8125rem; color: var(--muted); margin: 0 2px; }
.link-btn { border: 0; background: transparent; color: var(--accent); font-weight: 650; padding: 8px 4px; font-size: 0.9375rem; flex: none; }

/* ---------- сводка по оттенкам ---------- */
.shades { margin: 0 0 12px; }
.shades-h { font-size: 0.8125rem; color: var(--muted); margin: 0 2px 6px; }
.shades-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.shade { display: flex; align-items: stretch; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); overflow: hidden; font: inherit; min-width: 0; animation: shIn .25s ease both; }
button.shade:active { transform: scale(0.98); }
.shade .swatch { flex: none; width: 12px; border-right: 1px solid color-mix(in srgb, var(--fg) 10%, transparent); }
.sh-body { display: grid; gap: 2px; padding: 9px 10px; min-width: 0; }
.sh-top { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.sh-top b { font-family: var(--f-mono); font-size: 1.0625rem; font-weight: 650; flex: none; }
.sh-top em { font-style: normal; font-size: 0.8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-n { font-size: 0.875rem; font-weight: 600; }
.sh-f, .sh-r { font-size: 0.75rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@keyframes shIn { from { opacity: 0; transform: translateY(4px); } }

/* ---------- список: карточки-образцы ---------- */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.row {
  width: 100%; text-align: left; display: flex; align-items: stretch; gap: 0;
  padding: 0; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--lift);
  min-height: 92px; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.row .swatch { flex: none; width: 16px; border-right: 1px solid color-mix(in srgb, var(--fg) 10%, transparent); }
.row.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.row .info { min-width: 0; flex: 1; display: grid; gap: 3px; align-content: center; padding: 12px 10px 12px 14px; }
.row .num { font-family: var(--f-mono); font-size: 1.1875rem; font-weight: 600; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.25; }
.num .pre { color: var(--muted); font-weight: 500; }
.num mark { background: color-mix(in srgb, var(--tag) 70%, transparent); color: inherit; border-radius: 4px; padding: 0 1px; }
.row .fabric { font-size: 0.9375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .fabric.none { color: var(--muted); }
.row .tagline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 0.875rem; color: var(--muted); min-width: 0; }
.row .who { color: var(--muted); font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: 0.9; }
.row .rack { margin: 0 12px 0 4px; align-self: center; flex: none; }
.cname { display: inline-flex; align-items: center; min-width: 0; color: var(--fg); }
.qty { font-family: var(--f-mono); font-size: 0.8125rem; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--fg); }
.qty.zero { color: var(--danger); }

.chk { flex: none; width: 0; opacity: 0; overflow: hidden; height: 26px; align-self: center; }
.chk svg { width: 26px; height: 26px; display: block; }
.chk circle { fill: transparent; stroke: var(--muted); stroke-width: 2; }
.chk path { fill: none; stroke: var(--accent-fg); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; }
.list.selecting .chk { width: 26px; opacity: 1; margin-left: 12px; }
.row.sel .chk circle { fill: var(--accent); stroke: var(--accent); }
.row.sel .chk path { stroke-dashoffset: 0; }

/* жёлтая бирка стеллажа */
.rack {
  position: relative; display: inline-grid; justify-items: center; align-content: center; min-width: 66px; padding: 16px 10px 8px; gap: 0;
  background: var(--tag); color: var(--tag-fg); border-radius: 10px 10px 12px 12px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.10), 0 2px 0 rgba(0, 0, 0, 0.06);
}
.rack::before { content: ""; position: absolute; top: 6px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--hole, var(--surface)); box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.35); }
.row.sel .rack { --hole: var(--accent-soft); }
.rack small { font-size: 0.6875rem; font-weight: 600; opacity: 0.75; }
.rack b { font-family: var(--f-mono); font-size: 1.625rem; line-height: 1.05; font-weight: 700; overflow-wrap: anywhere; }
.rack em { font-style: normal; font-size: 0.75rem; font-weight: 650; background: rgba(0, 0, 0, 0.13); border-radius: 99px; padding: 0 8px; margin-top: 3px; white-space: nowrap; }
.rack.none { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); padding: 8px 10px; border-style: dashed; }
.rack.none::before { display: none; }
.rack.none b { font-size: 1.25rem; }
.rack.big { min-width: 118px; padding: 26px 18px 14px; border-radius: 14px 14px 16px 16px; }
.rack.big::before { top: 9px; width: 11px; height: 11px; margin-left: -5.5px; }
.rack.big b { font-size: 3.25rem; }
.rack.big small { font-size: 0.8125rem; }
.rack.big em { font-size: 0.9375rem; padding: 1px 10px; }
.rack.big.none { padding: 18px 14px; }

.chip { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 99px; font-size: 0.6875rem; font-weight: 500; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); vertical-align: 2px; }
.empty { padding: 34px 6px; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 1.125rem; font-weight: 650; margin-bottom: 6px; letter-spacing: -0.01em; }
.sw { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18); }

/* ---------- кнопки внизу ---------- */
.fab {
  position: fixed; right: max(16px, calc(50% - 280px + 16px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  z-index: 6; height: 60px; padding: 0 24px 0 20px; border-radius: 20px; border: 0;
  background: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow);
  display: inline-flex; align-items: center; gap: 10px; font-weight: 650; font-size: 1.0625rem;
}
.fab span { font-size: 1.75rem; line-height: 1; margin-top: -2px; font-weight: 400; }
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: var(--shadow); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-radius: 20px 20px 0 0;
}
.actionbar .inner { max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn { min-height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; padding: 0 14px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, transparent); background: transparent; }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }

/* ---------- окна снизу ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 12, 18, 0.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: var(--shadow);
  padding: 10px 16px calc(22px + env(safe-area-inset-bottom, 0px));
}
.sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet-body { display: grid; gap: 18px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.015em; align-self: center; }
.x { border: 0; background: var(--surface-2); width: 42px; height: 42px; border-radius: 12px; font-size: 1.125rem; color: var(--muted); flex: none; }

/* карточка рулона: отрез ткани сверху */
.cloth { position: relative; margin: -4px -4px 0; height: 116px; border-radius: 18px; overflow: hidden; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 10%, transparent); transform-origin: left center; }
.cloth::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), transparent 40%, rgba(0, 0, 0, 0.18)); }
.cloth .x { position: absolute; top: 10px; right: 10px; z-index: 1; background: rgba(255, 255, 255, 0.82); color: #1b2130; }
.cloth .cname-big { position: absolute; left: 12px; top: 12px; z-index: 1; font-size: 0.8125rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.86); color: #1b2130; max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.label { position: relative; margin: -34px 12px 0; z-index: 2; background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.label small { font-size: 0.75rem; color: var(--muted); }
.big-num { font-family: var(--f-mono); font-size: 1.5rem; font-weight: 700; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.2; }
.where { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.facts { margin: 0; display: grid; gap: 1px; min-width: 0; }
.facts dt { font-size: 0.8125rem; color: var(--muted); margin-top: 8px; }
.facts dt:first-child { margin-top: 0; }
.facts dd { margin: 0; font-size: 1.0625rem; font-weight: 500; overflow-wrap: anywhere; }
.facts.c1 { padding: 14px 16px; border-radius: 16px; background: var(--surface-2); grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; align-items: baseline; }
.facts.c1 dt { margin: 0; }
.facts dd.note { color: var(--danger); }
.warn-tag { display: inline-block; font-size: 0.75rem; font-weight: 650; padding: 2px 8px; border-radius: 999px; background: var(--danger); color: #fff; vertical-align: 2px; margin-left: 6px; }
.byline { font-size: 0.9375rem; padding: 11px 14px; border-radius: 14px; background: var(--surface-2); }
.byline b { font-weight: 650; }
.muted { color: var(--muted); font-size: 0.875rem; }
.hist h3 { margin: 0 0 8px; font-size: 0.9375rem; color: var(--fg); font-weight: 650; }
.hist-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hist-list li { position: relative; padding-left: 18px; }
.hist-list li::before { content: ""; position: absolute; left: 3px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.hist-list li::after { content: ""; position: absolute; left: 6px; top: 18px; bottom: -10px; width: 1px; background: var(--line); }
.hist-list li:last-child::after { display: none; }
.hist-list .h1 { display: flex; justify-content: space-between; gap: 10px; font-size: 0.9375rem; }
.hist-list time { color: var(--muted); font-size: 0.8125rem; white-space: nowrap; font-family: var(--f-mono); }
.hist-list .h2 { color: var(--muted); font-size: 0.8125rem; overflow-wrap: anywhere; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.warn { margin: 0; font-size: 1rem; }
.warn b { font-family: var(--f-mono); }
.hint { margin: 0; font-size: 0.875rem; color: var(--muted); }

form { display: grid; gap: 16px; }
.field { display: grid; gap: 7px; grid-template-columns: minmax(0, 1fr); align-content: start; }
.field label, .field .lbl { font-size: 0.875rem; font-weight: 600; }
.field input[type="text"], .field input[type="password"], .field input[type="search"], .field input:not([type]) {
  width: 100%; min-width: 0; height: 54px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); font-size: 1.0625rem;
}
.field input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.field input.bad { border-color: var(--danger); }
.field input[readonly] { color: var(--muted); }
.field input.mono { font-family: var(--f-mono); font-size: 1.1875rem; letter-spacing: 0.02em; }
.field .err { color: var(--danger); font-size: 0.875rem; min-height: 0; }
.field .err:empty { display: none; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.two > * { min-width: 0; }
.combo { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 8px; }
.combo.num { grid-template-columns: minmax(0, 1fr) 104px; }
.combo > * { min-width: 0; }
.check { display: flex; align-items: center; gap: 10px; font-size: 0.9375rem; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.form-err { color: var(--danger); font-size: 0.9375rem; font-weight: 500; }
.form-err:empty { display: none; }
.pw { position: relative; }
.pw input { padding-right: 104px !important; }
.pw button { position: absolute; right: 7px; top: 7px; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--accent); font-weight: 650; }

/* выбор цвета и ткани */
.pick { width: 100%; min-width: 0; height: 54px; padding: 0 12px 0 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); font-size: 1.0625rem; color: inherit; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; }
.pick .pv { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; }
.pick .ph { color: var(--muted); }
.pick .chev { color: var(--muted); flex: none; font-size: 0.875rem; }
.pick:active { border-color: var(--accent); }
#pickRoot .scrim { z-index: 30; }
#pickRoot .sheet { max-height: 86%; }
.pk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pk-chip, .pk-row, .pk-add, .pk-clear { border: 1.5px solid var(--line); background: var(--surface); color: inherit; border-radius: 14px; min-height: 52px; padding: 6px 12px 6px 6px; font-size: 1rem; text-align: left; display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
.pk-row, .pk-add, .pk-clear { padding-left: 14px; }
.pk-chip .dot { flex: none; width: 38px; height: 38px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.14); }
.pk-chip.on, .pk-row.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); font-weight: 650; }
.pk-rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pk-add { width: 100%; margin-bottom: 8px; border-style: dashed; font-weight: 650; color: var(--accent); }
.pk-clear { width: 100%; margin-bottom: 8px; color: var(--muted); }
.pk-chip:active, .pk-row:active, .pk-add:active, .pk-clear:active { background: var(--surface-2); }

/* ---------- вход ---------- */
.auth { max-width: 460px; margin-inline: auto; padding: 40px 16px 40px; display: grid; gap: 24px; }
.hero { display: grid; justify-items: start; gap: 16px; }
.hero-logo { width: 84px; height: 84px; border-radius: 24px; box-shadow: var(--shadow); display: block; }
.hero h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.auth .lead { margin: 6px 0 0; color: var(--muted); max-width: 32ch; }
.auth-card { display: grid; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: var(--lift); }
.auth-card form { gap: 14px; }
.ver { margin: 0; text-align: center; font-size: 0.8125rem; color: var(--muted); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-size: 0.9375rem; font-weight: 500; width: max-content; max-width: calc(100% - 32px); text-align: center;
  box-shadow: var(--shadow);
}
.toast.err { background: var(--danger); color: #fff; }

/* ---------- нижняя панель: раскладка и добавить ---------- */
.dock { position: fixed; right: max(16px, calc(50% - 280px + 16px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: flex; gap: 10px; align-items: center; }
.dock .fab { position: static; }
.dock-btn { height: 60px; padding: 0 18px 0 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 9px; font-weight: 650; font-size: 1rem; }
.dock-btn svg, .go svg { width: 24px; height: 24px; flex: none; }
.search #qScan { color: var(--fg); background: transparent; }
.search #qScan svg { width: 26px; height: 26px; display: block; margin: auto; }
.withbtn { position: relative; }
.withbtn input { padding-right: 60px !important; }
.withbtn .in-scan { position: absolute; right: 6px; top: 6px; width: 42px; height: 42px; border: 0; border-radius: 10px; background: var(--surface-2); color: var(--fg); }
.withbtn .in-scan svg { width: 24px; height: 24px; display: block; margin: auto; }

/* ---------- камера ---------- */
.cam { position: relative; border-radius: 18px; overflow: hidden; background: #0b0d12; aspect-ratio: 4 / 3; max-height: 38vh; width: 100%; }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam-frame { position: absolute; inset: 18% 10%; border-radius: 14px; pointer-events: none;
  background:
    linear-gradient(#fff, #fff) left top / 26px 3px no-repeat, linear-gradient(#fff, #fff) left top / 3px 26px no-repeat,
    linear-gradient(#fff, #fff) right top / 26px 3px no-repeat, linear-gradient(#fff, #fff) right top / 3px 26px no-repeat,
    linear-gradient(#fff, #fff) left bottom / 26px 3px no-repeat, linear-gradient(#fff, #fff) left bottom / 3px 26px no-repeat,
    linear-gradient(#fff, #fff) right bottom / 26px 3px no-repeat, linear-gradient(#fff, #fff) right bottom / 3px 26px no-repeat;
  box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.28); }
.cam-frame i { position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; border-radius: 2px; background: var(--tag); box-shadow: 0 0 12px var(--tag); }
.cam.hit .cam-frame { background-color: rgba(111, 211, 160, 0.25); }
.cam-torch { position: absolute; right: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, 0.86); color: #1b2130; }
.cam-torch svg { width: 24px; height: 24px; display: block; margin: auto; }
.cam-torch.on { background: var(--tag); }
.cam-msg { position: absolute; inset: auto 12px 12px 12px; margin: 0; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.92); color: #1b2130; font-size: 0.875rem; }
.cam.off { aspect-ratio: auto; min-height: 120px; }
.cam.off .cam-frame { display: none; }

/* окно сканера на весь экран */
#scanRoot .scanner { position: fixed; inset: 0; z-index: 35; background: #0b0d12; color: #fff; display: grid; grid-template-rows: auto 1fr auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
.scan-top { display: flex; align-items: center; justify-content: space-between; font-size: 1.125rem; }
.scan-top .x { background: rgba(255, 255, 255, 0.14); color: #fff; }
#scanRoot .cam { max-height: none; aspect-ratio: auto; height: 100%; }
.scan-hint { margin: 0; text-align: center; color: rgba(255, 255, 255, 0.75); }

/* ---------- режим раскладки ---------- */
#modeRoot .mode { position: fixed; inset: 0; z-index: 25; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.mode-in { max-width: 560px; margin-inline: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.mode .go { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
.preset { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 4px 14px; }
.preset summary { min-height: 48px; display: flex; align-items: center; font-weight: 600; cursor: pointer; list-style: none; }
.preset summary::after { content: "▾"; margin-left: auto; color: var(--muted); transition: transform 0.2s; }
.preset[open] summary::after { transform: rotate(180deg); }
.preset[open] { padding-bottom: 14px; display: grid; gap: 12px; }
.preset .hint { margin-top: -4px; }
.mode-top { display: flex; align-items: center; gap: 14px; }
.mode-title { flex: 1; min-width: 0; display: grid; gap: 1px; justify-items: start; }
.mode-title b { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.015em; }
.mode-title span { color: var(--muted); font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.mode-title .link-btn { padding: 2px 0; font-size: 0.875rem; }
.mode-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.mode-top .cam-toggle { width: 44px; height: 44px; flex: none; }
.mode-top .cam-toggle svg { width: 24px; height: 24px; }
@media (max-width: 420px) { .dock:has(#voiceBtn:not([hidden])) .dl { display: none; } .dock:has(#voiceBtn:not([hidden])) #modeBtn { width: 60px; padding: 0; justify-content: center; } }
@media (max-width: 520px) {
  .dock.compact .dl { display: none; }
  .dock.compact #modeBtn { width: 60px; padding: 0; justify-content: center; }
  .dock.compact #add { width: 60px; padding: 0; font-size: 0; justify-content: center; }
  .dock.compact #add span { font-size: 1.75rem; margin: 0; }
  .dock.compact #voiceBtn { width: 52px; }
}
.dock-btn.prihod { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.mode-preset { display: block; font-weight: 650; font-size: 0.875rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ml:has(.kg-row), .ml:has(.kg-done) { flex-wrap: wrap; }
.kg-row { flex-basis: 100%; display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin: 0 12px 12px 22px; }
.ml > .kg-done { flex-basis: 100%; margin: -4px 12px 10px 22px; }
.kg-row label { display: grid; gap: 2px; font-size: 0.75rem; font-weight: 650; color: var(--muted); }
.kg-row input { width: 100%; min-width: 0; height: 44px; padding: 0 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); font-size: 1.0625rem; }
.kg-row input:focus { border-color: var(--accent); outline: none; }
.kg-row .btn.sm { height: 44px; min-width: 48px; }
.kg-err { grid-column: 1 / -1; color: var(--danger); font-size: 0.8125rem; font-weight: 600; }
.ml.needkg { border-color: var(--accent) !important; box-shadow: 0 0 0 1.5px var(--accent); }
.kg-done { justify-self: start; padding: 3px 0; border: 0; background: none; color: var(--fg); font: inherit; font-size: 0.875rem; text-align: left; }
.kg-done b { font-family: var(--f-mono); }
.kg-ed { color: var(--accent); font-weight: 600; margin-left: 4px; }
.kgd { font-family: var(--f-mono); font-size: 0.8125rem; padding: 0 6px; border-radius: 6px; background: var(--surface-2); }
.kgd.minus { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.ml.ok.warn .ml-st, .ml.warn .ml-st { color: #b06f00 !important; font-weight: 650; }
.opt { font-weight: 400; color: var(--muted); font-size: 0.8125rem; }
@media (max-width: 420px) { .net:not(.off) #netText { display: none; } .brand h1 { font-size: 1.1875rem; } }
.mode-add input { width: 100%; min-width: 0; height: 54px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-family: var(--f-mono); font-size: 1.1875rem; }
.mode-add input:focus { border-color: var(--accent); outline: none; }
.mode-add .btn { min-height: 54px; }
.cam-toggle { width: 54px; height: 54px; border-radius: 14px; }
.cam-toggle svg { width: 26px; height: 26px; display: block; margin: auto; }
.cam-toggle.on { background: var(--fg); color: var(--bg); }
.mode-log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ml-empty { color: var(--muted); font-size: 0.9375rem; padding: 6px 2px; }
.ml { display: flex; align-items: stretch; gap: 0; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; min-height: 64px; }
.ml .swatch { flex: none; width: 10px; }
.ml-body { flex: 1; min-width: 0; display: grid; gap: 1px; padding: 9px 12px; align-content: center; }
.ml-body .num { font-family: var(--f-mono); font-weight: 600; font-size: 1.0625rem; overflow-wrap: anywhere; }
.ml-meta { font-size: 0.8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ml-st { font-size: 0.875rem; font-weight: 600; }
.ml.ok .ml-st { color: var(--ok); }
.ml.ok .ml-st::before { content: "✓ "; }
.ml.same .ml-st { color: var(--muted); }
.ml.err { border-color: color-mix(in srgb, var(--danger) 60%, transparent); }
.ml.err .ml-st { color: var(--danger); font-weight: 500; }
.ml.wait .ml-st { color: var(--muted); }
.ml.undone { opacity: 0.55; }
.ml.undone .ml-st { color: var(--muted); }
.ml-undo { align-self: center; margin-right: 8px; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-weight: 600; font-size: 0.875rem; flex: none; }

@media (prefers-reduced-motion: no-preference) {
  .cam-frame i { animation: laser 1.6s ease-in-out infinite alternate; }
  @keyframes laser { from { transform: translateY(-46px); opacity: 0.6; } to { transform: translateY(46px); opacity: 1; } }
  .cam.hit .cam-frame { animation: camhit 0.45s ease-out; }
  @keyframes camhit { from { background-color: rgba(111, 211, 160, 0.55); } to { background-color: transparent; } }
  #modeRoot .mode.in { animation: modein 0.38s var(--ease) both; }
  #modeRoot .mode.out { animation: modeout 0.22s ease-in both; }
  @keyframes modein { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  @keyframes modeout { from { opacity: 1; } to { opacity: 0; transform: translateY(24px); } }
  #scanRoot .scanner { animation: fadein 0.2s ease-out both; }
  #scanRoot .scanner.out { animation: fadeout 0.18s ease-in both; }
  .ml.fresh { animation: mlin 0.4s var(--spring) both; }
  @keyframes mlin { from { opacity: 0; transform: translateY(-10px) scale(0.97); } to { opacity: 1; transform: none; } }
  .ml.ok .ml-st::before { display: inline-block; animation: tick 0.4s var(--spring) both; }
  @keyframes tick { from { transform: scale(0); } to { transform: none; } }
  .dock-btn { animation: pop 0.45s var(--spring) 0.05s both; }
}


/* ---------- соседи ---------- */
.ftog { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px 0 10px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 600; font-size: 0.9375rem; flex: none; }
.ftog svg { width: 22px; height: 22px; }
.ftog[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.count-row .grow { flex: 1; }
.count-row { justify-content: flex-start; gap: 8px; }
.ftog .fn { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 0.75rem; display: inline-grid; place-items: center; margin-right: -6px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 6px 0 12px; border-radius: 99px; border: 0; background: var(--accent-soft, #e6e9ff); color: var(--fg); font: inherit; font-size: 0.875rem; font-weight: 600; max-width: 100%; }
.fchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fchip i.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--c, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 20%, transparent); }
.fchip em { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--fg) 10%, transparent); font-size: 0.75rem; flex: none; }
.fchip.clear { background: transparent; color: var(--accent); padding: 0 10px; }
.ff-sec { margin: 4px 0 16px; }
.ff-sec h3 { font-size: 0.8125rem; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
.ff-sec h3 button { text-transform: none; letter-spacing: 0; }
.ff-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 260px; overflow: auto; padding: 2px; }

.ff-chip i.dot { width: 16px; height: 16px; border-radius: 50%; flex: none; background: var(--c, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 20%, transparent); }
.ff-chip small { font-family: var(--f-mono); color: var(--muted); font-size: 0.75rem; }

.ff-q { margin-bottom: 8px; }
.count { margin: 0 2px 8px; }
.nbtag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; font-family: var(--f-body); font-size: 0.6875rem; font-weight: 650; vertical-align: 3px; background: var(--accent-soft); color: var(--accent); }
.item.nbr .row { border-style: dashed; }
.nb h3 { margin: 0; font-size: 0.9375rem; font-weight: 650; }
.nb h3 span { font-family: var(--f-mono); font-weight: 500; color: var(--muted); margin-left: 4px; }
.nb .hint { margin: 2px 0 8px; }
.nb-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.nb-item { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "num qty" "place qty"; gap: 0 10px; align-items: center; text-align: left; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.nb-item .num { grid-area: num; font-family: var(--f-mono); font-weight: 600; font-size: 0.9375rem; overflow-wrap: anywhere; }
.nb-item .nb-place { grid-area: place; font-size: 0.875rem; font-weight: 600; color: var(--fg); }
.nb-item .nb-place.none { color: var(--muted); font-weight: 500; }

.nb-item.me .nb-place { color: var(--accent); }

/* ---------- заказы ---------- */
.obtn { position: relative; width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface); color: var(--fg); box-shadow: var(--lift); flex: none; }

.obtn .badge { position: absolute; top: -5px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 0.75rem; font-weight: 700; line-height: 20px; text-align: center; font-family: var(--f-mono); }
#repRoot .orders { position: fixed; inset: 0; z-index: 17; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.o-top .rep-open { margin-left: auto; }

.rep-ob { flex: 1; min-width: 0; display: grid; gap: 2px; }
.rep-ob b { font-size: 0.9375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rep-ob span { font-size: 0.8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rep-date input { height: 48px; padding: 0 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 1rem; }
.rep-hint { margin: 10px 2px; }
.a4wrap { display: block; width: 100%; overflow: hidden; padding-bottom: 40px; }
.a4wrap .a4 { margin: 0 0 14px; }
.a4, .a4stage .a4 { width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 36px; background: #fff; color: #111; font-family: Arial, "Helvetica Neue", sans-serif; font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.18); position: relative; overflow: hidden; }
.a4stage { position: fixed; left: -10000px; top: 0; }

.a4 td.num { text-align: right; }

.a4 .hd { margin-bottom: 8px; }
.a4 .hd th { font-size: 13px; width: 9%; }
.a4 .hd th.big { font-size: 17px; width: 30%; letter-spacing: .06em; }
.a4 .ret { margin-top: 14px; }
.a4 .ret b { display: block; text-align: center; margin-bottom: 4px; letter-spacing: .08em; }

.a4.nakl h1 { font-size: 22px; text-align: center; margin: 0 0 6px; letter-spacing: .04em; }
.a4.nakl .box { display: inline-block; min-width: 160px; height: 26px; border: 1.5px solid #222; border-radius: 4px; vertical-align: middle; }
.a4.nakl .dt { text-align: center; margin: 0 0 14px; }
.a4.nakl .ln { display: flex; gap: 10px; margin: 0 0 8px; align-items: baseline; }
.a4.nakl .ln span { white-space: nowrap; font-style: italic; }
.a4.nakl .ln b { flex: 1; border-bottom: 1px solid #222; min-height: 20px; font-size: 16px; font-weight: 600; padding: 0 6px; }
.a4.nakl .grid { margin-top: 12px; }
.a4 .tot { width: 45%; margin: 12px 0 0 auto; }
.a4 .tot th { text-align: left; font-size: 14px; }
.a4 .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 30px; margin-top: 26px; font-weight: 700; }
#sumRoot .orders { position: fixed; inset: 0; z-index: 16; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.sum-sec { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin: 0 0 12px; }
.sum-sec h3 { margin: 0 0 10px; font-size: 0.8125rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.sum-big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sum-big div { display: grid; gap: 2px; }
.sum-big b { font-family: var(--f-mono); font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
.sum-big span { font-size: 0.8125rem; color: var(--muted); }
.sum-types { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.sum-types span { font-size: 0.875rem; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); }
.sum-types span b { font-family: var(--f-mono); margin-left: 4px; }
.sum-tbl { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
.sum-tbl th { text-align: right; font-size: 0.75rem; font-weight: 600; color: var(--muted); padding: 0 0 6px 8px; }
.sum-tbl th:first-child, .sum-tbl td:first-child { text-align: left; padding-left: 0; }
.sum-tbl td { text-align: right; padding: 8px 0 8px 8px; border-top: 1px solid var(--line); font-family: var(--f-mono); }
.sum-tbl td:first-child { font-family: inherit; font-weight: 600; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum-note { font-size: 0.8125rem; color: var(--muted); margin: 8px 0 0; }
.role-tag { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--fg); color: var(--bg); font-size: 0.8125rem; font-weight: 700; }
#ordersRoot .orders { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.o-top { display: flex; align-items: center; gap: 12px; }
.o-top h2 { margin: 0; font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; }
.o-chats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.ochip { flex: none; height: 36px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 600; font-size: 0.875rem; white-space: nowrap; }
.ochip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.o-list { display: grid; gap: 12px; }
.ocard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; box-shadow: var(--lift); position: relative; overflow: hidden; }
.ocard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
.ocard.st-taken::before { background: var(--tag); }
.ocard.st-done::before { background: var(--ok); }
.ocard.st-done { opacity: 0.85; }
.oc-head { display: flex; justify-content: space-between; gap: 10px; font-size: 0.8125rem; color: var(--muted); }
.oc-head time { font-family: var(--f-mono); white-space: nowrap; margin-left: auto; }
.oc-del { flex: none; margin: -6px -6px 0 2px; height: 32px; min-width: 32px; padding: 0 8px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--muted); font: inherit; font-size: 0.875rem; font-weight: 700; }
.oc-del.armed { background: var(--danger); color: #fff; }
.ocard.removing { opacity: .4; transition: opacity .2s; }
.oc-chat { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.otype { display: inline-block; margin-right: 8px; padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; vertical-align: 1px; background: var(--surface-2); color: var(--fg); }
.otype.t-acorn, .otype.t-market, .otype.t-move { background: #e8590c; color: #fff; }
.otype.t-post { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); }
.oi-lab.big { font-size: 1rem; padding: 3px 10px; margin: 0 0 6px; display: inline-block; }
.oi-lab { justify-self: start; font-size: 0.8125rem; font-weight: 700; padding: 1px 8px; border-radius: 6px; background: var(--fg); color: var(--bg); margin-bottom: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oc-who { font-weight: 650; font-size: 1.0625rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.oc-doc { font-weight: 500; font-size: 0.875rem; color: var(--muted); }
.oc-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.9375rem; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.oc-photo { padding: 0; border: 0; border-radius: 12px; overflow: hidden; background: var(--surface-2); min-height: 80px; display: block; width: 100%; }
.oc-photo img { display: block; width: 100%; max-height: 220px; object-fit: cover; object-position: top left; }
.oc-ocr { margin: 0; font-size: 0.875rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.oc-ocr.warn { color: var(--danger); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); display: inline-block; flex: none; }
.oc-items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.oi { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); box-shadow: var(--lift); }
.oi.st-done { opacity: 0.7; }
.oi.gone { opacity: 0.6; }
.oi.gone .ost { color: var(--muted); }
.oi-main { width: 100%; display: flex; align-items: stretch; border: 0; padding: 0; background: transparent; text-align: left; min-height: 64px; }
.oi-main .swatch { flex: none; width: 10px; }
.oi-info { flex: 1; min-width: 0; display: grid; gap: 1px; align-content: center; padding: 8px 10px 8px 12px; }
.oi-info .num { font-family: var(--f-mono); font-weight: 600; font-size: 0.9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.oi-meta { font-size: 0.8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oi-meta.warn { color: var(--danger); }
.oi-main .rack { margin: 0 10px 0 4px; align-self: center; min-width: 56px; padding: 13px 8px 6px; }
.oi-main .rack b { font-size: 1.25rem; }
.oi-main .rack.none { padding: 6px 8px; }
.oi-act { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 10px 10px; flex-wrap: wrap; }
.btn.sm { min-height: 40px; padding: 0 16px; border-radius: 11px; font-size: 0.9375rem; }
.mini { height: 36px; min-width: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 600; font-size: 0.875rem; }
.ost { margin-right: auto; font-size: 0.875rem; font-weight: 600; }
.ost.taken { color: color-mix(in srgb, var(--tag) 55%, var(--fg)); }
.ost.done { color: var(--ok); }
.oc-foot { display: grid; gap: 6px; font-size: 0.875rem; color: var(--muted); }
.oc-foot.solo { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; color: inherit; }
.oc-prog { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.oc-prog i { display: block; height: 100%; width: calc(var(--p) * 100%); background: var(--ok); border-radius: 3px; }
.oc-add { justify-self: start; padding: 4px 0; }
.o-addform { display: grid; grid-template-columns: minmax(0, 1fr) auto 48px; gap: 8px; }
.o-addform input { width: 100%; min-width: 0; height: 48px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-family: var(--f-mono); font-size: 1.0625rem; }
.o-addform .btn { min-height: 48px; }
.o-addform .icon-btn { width: 48px; height: 48px; }
.o-addform .icon-btn svg { width: 24px; height: 24px; display: block; margin: auto; }
.oc-skip { margin: 0; font-size: 0.8125rem; color: var(--muted); padding: 8px 12px; border-radius: 12px; border: 1px dashed var(--line); overflow-wrap: anywhere; white-space: pre-line; }
.otag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; font-family: var(--f-body); font-size: 0.6875rem; font-weight: 650; vertical-align: 3px; background: var(--tag); color: var(--tag-fg); }
.inorders { display: grid; gap: 8px; padding: 12px 14px; border-radius: 16px; background: color-mix(in srgb, var(--tag) 22%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tag) 60%, transparent); }
.inorders h3 { margin: 0; font-size: 0.9375rem; font-weight: 650; }
.io { display: grid; gap: 6px; }
.io-t { display: grid; gap: 1px; font-size: 0.875rem; }
.io-t span { color: var(--muted); }
.io .oi-act { padding: 0; }
#scanRoot .viewer { position: fixed; inset: 0; z-index: 35; background: #0b0d12; color: #fff; display: grid; grid-template-rows: auto 1fr auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
.v-img { overflow: auto; border-radius: 12px; background: #fff; }
.v-img img { display: block; width: 100%; }
.v-img.zoom img { width: 250%; max-width: none; }
@media (prefers-reduced-motion: no-preference) {
  #ordersRoot .orders.in, #sumRoot .orders.in { animation: modein 0.34s var(--ease) both; }
  #sumRoot .orders.out { animation: modeout 0.2s ease-in both; }
  #ordersRoot .orders.out { animation: modeout 0.2s ease-in both; }
  .spin { animation: rot 0.8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .obtn.ping .badge { animation: ping 0.6s var(--spring) 2; }
  @keyframes ping { 50% { transform: scale(1.35); } }
  .oc-prog i { transition: width 0.4s var(--ease); }
}


/* ---------- голос и штрихкоды стеллажей ---------- */
.dock-btn.mic { width: 60px; padding: 0; justify-content: center; }
.dock-btn.mic svg { width: 26px; height: 26px; }
.heard { margin: 0; font-size: 1.0625rem; font-style: italic; color: var(--muted); }
.vroll { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.vroll .swatch { width: 12px; flex: none; }
.vroll > div { display: grid; gap: 2px; padding: 10px 12px; }
.vroll .num { font-family: var(--f-mono); font-size: 1.125rem; }
.vroll span { font-size: 0.875rem; color: var(--muted); }
.vlist { display: grid; gap: 6px; }
.ml-rack { text-align: center; font-weight: 700; font-size: 0.9375rem; padding: 8px; border-radius: 12px; background: var(--tag); color: var(--tag-fg); }
.mode .go + .go { margin-top: -6px; }


.cut { flex: none; align-self: center; display: grid; justify-items: center; gap: 0; min-width: 64px; padding: 6px 8px; margin-left: 4px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--fg); border: 1.5px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.cut small { font-size: 0.6875rem; font-weight: 650; color: var(--accent); white-space: nowrap; }
.cut b { font-family: var(--f-mono); font-size: 1rem; font-weight: 700; white-space: nowrap; }
.cut.whole { background: var(--surface-2); border-color: var(--line); }
.cut.whole small { color: var(--muted); }
.cut.unsure { background: color-mix(in srgb, #e8a10c 18%, var(--surface)); border-color: #e8a10c; border-style: dashed; }
.cut.unsure small { color: #b06f00; }
.cut.big { justify-self: start; grid-auto-flow: column; gap: 8px; align-items: baseline; padding: 6px 12px; }
.cut.big b { font-size: 1.25rem; }

/* ---------- движение ---------- */
@media (prefers-reduced-motion: no-preference) {
  .tabs .ind { transition: transform 0.38s var(--spring); }
  .tab { transition: color 0.2s; }

  .item.enter { animation: rise 0.42s var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .item.enter .swatch { animation: unroll 0.5s var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms + 80ms); transform-origin: top; }
  @keyframes unroll { from { transform: scaleY(0); } to { transform: none; } }

  .row { transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.14s var(--ease); }
  .row:active { transform: scale(0.982); }
  .chk { transition: width 0.28s var(--ease), opacity 0.2s, margin-left 0.28s var(--ease); }
  .chk circle { transition: fill 0.18s, stroke 0.18s; }
  .chk path { transition: stroke-dashoffset 0.26s ease-out 0.05s; }

  .btn, .fab, .icon-btn, .text-btn, .avatar, .pick, .pk-chip, .pk-row, .x { transition: transform 0.14s var(--ease), background-color 0.18s, color 0.18s, border-color 0.18s, opacity 0.18s; }
  .btn:active, .fab:active, .icon-btn:active, .text-btn:active, .avatar:active, .x:active, .pk-chip:active, .pk-row:active { transform: scale(0.96); }
  .field input, .search input { transition: border-color 0.15s, background-color 0.15s; }

  .fab { animation: pop 0.45s var(--spring) both; }
  @keyframes pop { from { opacity: 0; transform: scale(0.6) translateY(16px); } to { opacity: 1; transform: none; } }
  .selbar { animation: drop 0.24s var(--ease) both; }
  .brand { animation: fadein 0.2s ease-out both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .actionbar { animation: slideup 0.32s var(--ease) both; }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }

  .scrim { animation: fadein 0.22s ease-out both; }
  .scrim.out { animation: fadeout 0.2s ease-in both; pointer-events: none; }
  .sheet { animation: sheetup 0.46s var(--spring) both; }
  .scrim.out .sheet { animation: sheetdown 0.22s ease-in both; }
  @keyframes sheetup { from { transform: translateY(70%); } to { transform: none; } }
  @keyframes sheetdown { from { transform: none; } to { transform: translateY(100%); } }
  .sheet-body.swap { animation: swap 0.26s var(--ease) both; }
  @keyframes swap { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* отрез ткани разворачивается, бирка и номер ложатся сверху */
  .sheet-body.swap .cloth, .scrim:not(.out) .cloth.fresh { animation: cloth 0.6s var(--ease) both; }
  @keyframes cloth { from { clip-path: inset(0 100% 0 0 round 18px); } to { clip-path: inset(0 0 0 0 round 18px); } }
  .cloth.fresh + .label { animation: label 0.5s var(--spring) 0.18s both; }
  @keyframes label { from { opacity: 0; transform: translateY(14px) rotate(-1.5deg); } to { opacity: 1; transform: none; } }
  .where .rack.big.fresh { animation: swing 0.9s var(--ease) 0.25s both; transform-origin: 50% 9px; }
  @keyframes swing { 0% { transform: rotate(-14deg); opacity: 0; } 35% { transform: rotate(8deg); opacity: 1; } 60% { transform: rotate(-4deg); } 80% { transform: rotate(2deg); } 100% { transform: none; } }

  .pk-chip, .pk-row { animation: fadein 0.2s ease-out both; }

  .toast { animation: toastin 0.34s var(--spring) both; }
  .toast.out { animation: toastout 0.22s ease-in both; }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 18px) scale(0.94); } to { opacity: 1; transform: translateX(-50%); } }
  @keyframes toastout { from { opacity: 1; transform: translateX(-50%); } to { opacity: 0; transform: translate(-50%, 10px); } }

  .hero-logo { animation: pop 0.5s var(--spring) both; }
  .logo { animation: pop 0.45s var(--spring) both; }
  .auth-card { animation: swap 0.34s var(--ease) both; }
  .form-err:not(:empty) { animation: shake 0.3s ease-out; }
  @keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
}

  /* ---------- сканер штрихкода ---------- */
  /* Свой распознаватель EAN-13 (штрихкоды 1С вида 2000000374086) + встроенный BarcodeDetector, если телефон его умеет */
  var EAN_L = [[3, 2, 1, 1], [2, 2, 2, 1], [2, 1, 2, 2], [1, 4, 1, 1], [1, 1, 3, 2], [1, 2, 3, 1], [1, 1, 1, 4], [1, 3, 1, 2], [1, 2, 1, 3], [3, 1, 1, 2]];

      case "o-done": setOrder(+el.getAttribute("data-id"), "done"); return;
      case "o-reset": setOrder(+el.getAttribute("data-id"), "open"); return;
      case "o-add": OR.adding = +el.getAttribute("data-id"); drawOrders(); setTimeout(function () { var f = $("#oadd-" + OR.adding); if (f) f.focus(); }, 50); return;
      case "o-scan": openScan("order:" + el.getAttribute("data-id")); return;
      case "o-photo": openPhoto(+el.getAttribute("data-id")); return;
      case "o-reocr": reOcr(+el.getAttribute("data-id")); return;
      case "viewer-close": closeViewer(); return;
      case "oi-open": var rid2 = el.getAttribute("data-id"); if (state.rolls.has(rid2)) openSheet({ type: "detail", id: rid2 }); else toast("Рулона " + rid2 + " нет в базе.", true); return;
      case "flt-open": exitSelect(); openSheet({ type: "filter", cq: "" }); return;
      case "flt-reset": state.flt = { color: "", num: "", fabric: "", rack: "", floor: "" }; if (state.sheet) state.sheet.cq = ""; fltChanged(true); return;
      case "nb-toggle": state.nb = !state.nb; lsSet("sklad_nb", state.nb ? "1" : null); state.seen.clear(); lastListHtml = null; render(); return;
      case "open-roll": openSheet({ type: "detail", id: el.getAttribute("data-id") }); return;
      case "mode-close": closeMode(); return;
      case "mode-setup": if (state.mode2) { Scan.stop(); state.mode2.step = "setup"; drawMode(true); } return;
      case "mode-cam": if (state.mode2) { state.mode2.cam = !state.mode2.cam; if (!state.mode2.cam) Scan.stop(); drawMode(false); } return;
      case "pk-close": closePicker(); return;
      case "pick-fabric": openPicker("fabric"); return;
      case "pick-color": openPicker("color"); return;
      case "scrim": if (t === el) closeSheet(); return;
      case "close": closeSheet(); return;
      case "account": openSheet({ type: "account" }); return;
      case "logout": closeSheet(true); signOut(""); return;
      case "show-pass": var pi = $("#a-pass"), show = pi.type === "password"; pi.type = show ? "text" : "password"; el.textContent = show ? "Скрыть" : "Показать"; return;
      case "add": openSheet({ type: "add", values: { roll: /^\d+$/.test(state.q.trim()) ? state.q.trim() : "" } }); return;
      case "sel-start": enterSelect(null); return;
      case "sel-cancel": exitSelect(); return;
      case "sel-all": visible().forEach(function (it) { state.sel.add(it.id); }); applySelectUi(); return;
      case "bulk-edit": if (state.sel.size) openSheet({ type: "bulk", ids: Array.from(state.sel) }); return;
      case "bulk-ask-delete": if (state.sel.size) openSheet({ type: "confirm", kind: "delete", ids: Array.from(state.sel), back: null }); return;
      case "bulk-ask-purge": if (state.sel.size) openSheet({ type: "confirm", kind: "purge", ids: Array.from(state.sel), back: null }); return;
      case "bulk-restore": if (state.sel.size) restore(Array.from(state.sel)); return;
    }
    if (!s) return;
    if (act === "edit-one") { var r = state.rolls.get(s.id) || {}; openSheet({ type: "edit", id: s.id, values: { roll: s.id, rack: r.rack, floor: r.floor, fabric: r.fabric, color: r.color, kgl: r.kgLabel, kgr: r.kgReal } }); }
    else if (act === "back-detail") openSheet({ type: "detail", id: s.id });
    else if (act === "ask-delete-one") openSheet({ type: "confirm", kind: "delete", ids: [s.id], back: s.id });
    else if (act === "ask-purge-one") openSheet({ type: "confirm", kind: "purge", ids: [s.id], back: s.id });
    else if (act === "cancel-confirm") { if (s.back) openSheet({ type: "detail", id: s.back }); else closeSheet(); }
    else if (act === "run-confirm") runConfirm();
    else if (act === "restore-one") restore([s.id]);
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.matches("#form")) saveForm();
    else if (e.target.matches(".o-addform")) { var oid = +e.target.getAttribute("data-id"); orderAddItem(oid, val("#oadd-" + oid)); }
    else if (e.target.matches("#modeForm")) modeStart();
    else if (e.target.matches("#modeAdd")) modeAdd(val("#m-code"), false);
    else if (e.target.matches("#authForm")) submitAuth();
  });
  /* долгое нажатие на рулон включает выбор */
  document.addEventListener("pointerdown", function (e) {
    lpFired = false; clearTimeout(lpTimer);
    var row = e.target.closest && e.target.closest(".row[data-open]");
    if (!row || state.selecting) return;
    var id = row.getAttribute("data-open"), sx = e.clientX, sy = e.clientY;
    row._sx = sx; row._sy = sy;
    lpTimer = setTimeout(function () { lpFired = true; vib(); enterSelect(id); }, 480);
  });
  document.addEventListener("pointermove", function (e) {
    if (!lpTimer) return;
    var row = e.target.closest && e.target.closest(".row[data-open]");
    if (row && row._sx != null && (Math.abs(e.clientX - row._sx) > 10 || Math.abs(e.clientY - row._sy) > 10)) clearTimeout(lpTimer);
  });
  ["pointerup", "pointercancel", "scroll"].forEach(function (n) { document.addEventListener(n, function () { clearTimeout(lpTimer); }, true); });
  document.addEventListener("contextmenu", function (e) { if (e.target.closest && e.target.closest(".row")) e.preventDefault(); });

  $("#q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  document.addEventListener("input", function (e) {
    var kf = e.target && e.target.getAttribute && e.target.getAttribute("data-kg");
    if (kf) { var ke2 = kgEntry(e.target.getAttribute("data-code")); if (ke2) { if (kf === "l") ke2.inL = e.target.value; else ke2.inR = e.target.value; ke2.kgErr = ""; } return; }
    var id = e.target && e.target.id, s = state.sheet;
    if (!s || s.type !== "filter") return;
    if (id === "ff-q") {
      s.cq = e.target.value;
      var tmp = document.createElement("div"); tmp.innerHTML = filterSheetHtml(s);
      var nc = tmp.querySelector("#ffColors"), oc = $("#ffColors"); if (nc && oc) oc.innerHTML = nc.innerHTML;
    } else if (id === "ff-rack" || id === "ff-floor") {
      state.flt[id === "ff-rack" ? "rack" : "floor"] = e.target.value.trim(); fltChanged(false);
    }
  });
  $("#q").addEventListener("keydown", function (e) { if (e.key === "Enter") e.target.blur(); });
  window.addEventListener("online", function () { state.online = true; render(); });
  window.addEventListener("offline", function () { state.online = false; render(); });

  /* кнопка «назад» на Android */
  function backAction() {
    if (state.pick) { closePicker(); return true; }
    if (closeViewer()) return true;
    if (REP.open && REP.step === "sheet") { REP.step = "pick"; drawRep(); return true; }
    if (closeRep()) return true;
    if (closeSum()) return true;
    if (closeScan()) return true;
    if (state.mode2) { closeMode(); return true; }
    if (state.sheet) { closeSheet(); return true; }
    if (closeOrders()) return true;
    if (state.selecting) { exitSelect(); return true; }
    if (state.q) { state.q = ""; $("#q").value = ""; render(); return true; }
    return false;
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { backAction(); return; }
    var kf = e.key === "Enter" && e.target && e.target.getAttribute && e.target.getAttribute("data-kg");
    if (kf) { e.preventDefault(); var code = e.target.getAttribute("data-code"); if (kf === "l") kgRefocus(code, "r"); else kgSave(code); }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (scanTarget) closeScan(); Scan.stop(); }
    else if (state.mode2 && state.mode2.step === "run" && state.mode2.cam) resumeModeCam();
  });
  try {
    var capApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (capApp && capApp.addListener) {
      capApp.addListener("backButton", function () { if (!backAction() && capApp.exitApp) capApp.exitApp(); });
    }
  } catch (err) {}

  state.nb = lsGet("sklad_nb") === "1";

  /* ---------- запуск ---------- */
  if (configured()) {
    session = readSession();
    if (session) { state.user = session.user; state.mode = "shared"; repo = supaRepo(); }
    else state.mode = "auth";
  } else {
    state.mode = "local"; state.user = { name: "Вы (пробный режим)", login: "" }; repo = localRepo();
  }
  render();
  if (repo) startRepo();
})();
</script>
</body>
</html>
